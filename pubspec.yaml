name: payflow
description: "Payflow — keep your financial flow under control."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  collection: ^1.19.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0E6B5A"
  adaptive_icon_background: "#0E6B5A"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/app_icon_monochrome.png"
